    <div [id]="menuLangSet ? 'lang-wrp-after' : 'null'" class="lang-wrapper">
      <button [id]="menuLangSet ? 'activated' :  'notActivated'" (click)="menuLangSet = !menuLangSet" class="lang-button" type="button" >LANG</button>
      <div *ngIf="menuLangSet" id="lang-subwrap" >
        <span [style.backgroundColor]="selectedLang.toLowerCase() == lang.toLowerCase() ? 'var(--darkBlueTheme)' : undefined"  (click)="menuLangSet = !menuLangSet;selectedLang = lang" [style.animationDelay]="  i * 100 + 'ms'" *ngFor="let lang of langs;index as i">{{lang}}</span>
      </div>
    </div>


    <button  type="button"  *ngIf="!isConnected"  (click)="openLoginForm()">   Connection</button>

    <button type="button"  *ngIf="isConnected"  (click)="openLogoutDialog()">   Déconnection</button>

<button type="button" *ngIf="isConnected && isAdmin"  routerLink="/admin">Espace administrateur</button>

<button type="button" *ngIf="!isConnected "   (click)="openRegisterForm()">Inscription</button>
