<mat-card>

  <div fxFill id="column3" fxFlex fxLayoutGap="25px" fxLayout="column">
    <input max="10" multiple accept=".jpg,.jpeg,.pdf,.png,.raw" type="file" />
  </div>     

  <li *ngFor="let object of objectTestList;i as index">

    <ul>
      {{object | json}}
    </ul>

  </li>


</mat-card>
