
<div  fxLayout="column"  fxLayoutGap="7%">
<div  fxLayout="column" fxLayoutAlign="center end"  fxLayoutGap="10%" >
        <button mat-icon-button mat-dialog-close>&times;</button>
        </div>
<form (submit)="loginUser(id.value,psw.value)"  fxLayoutGap="10%"  fxLayout="column"  fxLayoutAlign="center center">

    <div fxLayout="column" fxLayoutGap="20px" fxLayoutAlign="center center">
        <h1>Login</h1>
    <mat-form-field>
        <input placeholder="ID" #id type="text" matInput>
    </mat-form-field>
    <mat-form-field>
        <input placeholder="Password" #psw type="password" matInput>
    </mat-form-field>
    <button type="submit" mat-raised-button>Connect</button>
</div>

<div [hidden]="submited == false">
    <mat-spinner  [diameter]="40"></mat-spinner>
</div>
<div  [hidden]="msg == ''">
    <span > 
        {{msg}} 
    </span>

</div>
</form>

</div>
